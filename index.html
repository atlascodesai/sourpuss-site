<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sourpuss — Whisky Sour Reviews</title>
    <meta name="description" content="Find and rate the best whisky sours in your city. A community app for discerning cocktail enthusiasts.">
    <meta name="keywords" content="whisky sour, cocktail reviews, bar finder, cocktail app, drink ratings">
    <meta name="author" content="Sourpuss">
    <link rel="canonical" href="https://sourpuss.app">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sourpuss.app">
    <meta property="og:title" content="Sourpuss — Whisky Sour Reviews">
    <meta property="og:description" content="Find and rate the best whisky sours in your city. A community app for discerning cocktail enthusiasts.">
    <meta property="og:image" content="https://sourpuss.app/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://sourpuss.app">
    <meta name="twitter:title" content="Sourpuss — Whisky Sour Reviews">
    <meta name="twitter:description" content="Find and rate the best whisky sours in your city. A community app for discerning cocktail enthusiasts.">
    <meta name="twitter:image" content="https://sourpuss.app/og-image.png">

    <!-- Theme color -->
    <meta name="theme-color" content="#FFD9D4">
    <meta name="msapplication-TileColor" content="#FFD9D4">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="page-home">
    <!-- Cat Toy Ball of Wool -->
    <div class="cat-toy" id="catToy">
        <svg viewBox="0 0 100 220" preserveAspectRatio="xMidYMin meet">
            <path class="toy-string" d="M 50 0 Q 50 75 50 150"/>
        </svg>
        <div class="toy-ball">
            <div class="toy-ball-connector"></div>
        </div>
    </div>

    <!-- Navigation -->
    <nav>
        <a href="/" class="active">Home</a>
        <a href="/privacy">Privacy</a>
        <a href="/support">Support</a>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <!-- Floaters populated by JS -->
        <div class="hero-content">
            <img src="/logo.png" alt="Sourpuss" class="hero-logo">
            <h1>Sour<span class="highlight">puss</span></h1>
            <p class="tagline">Find and rate the best whisky sours in your city. A community for discerning sippers.</p>
            <a href="#" class="cta-button">
                <span class="icon"></span>
                Coming Soon to App Store
            </a>
        </div>
    </section>

    <!-- Marquee with quotes -->
    <div class="marquee-container">
        <div class="marquee">
            <!-- Populated by JS -->
        </div>
    </div>

    <!-- Features Section -->
    <section class="features">
        <div class="features-header reveal">
            <h2>Everything you need</h2>
            <p>Your pocket guide to the perfect pour</p>
        </div>
        <div class="features-grid">
            <!-- Populated by JS -->
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="footer-logo">🐱 Sourpuss</div>
        <div class="footer-links">
            <!-- Populated by JS -->
        </div>
        <p class="footer-tagline">Made with whisky and cats</p>
    </footer>

    <!-- Config and App Scripts -->
    <script src="/config.js"></script>
    <script src="/app.js"></script>
</body>
</html>
